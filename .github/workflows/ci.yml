name: CI

on:
  workflow_dispatch:
  push:
    branches: [ main, projekt/examination ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Lint
        run: ruff check app tests

      - name: Test
        run: pytest --junitxml=reports/pytest.xml

      - name: Save test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-results
          path: reports/pytest.xml

  build-image:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t devops25-cicd-demo:${{ github.sha }} .

      - name: Start container
        run: docker run -d --name exam-app -p 127.0.0.1:8000:8000 devops25-cicd-demo:${{ github.sha }}


      - name: Verify deployment
        shell: bash
        run: |
          curl -fsS --retry 10 --retry-connrefused --retry-delay 1 --max-time 5 "http://127.0.0.1:8000/health" \
            | python3 -c 'import json, sys; data = json.load(sys.stdin); assert data == {"status": "ok"}, data; print("Health OK")'

          curl -fsS --max-time 5 "http://127.0.0.1:8000/api/add?a=100&b=5" \
            | python3 -c 'import json, sys; data = json.load(sys.stdin); assert data == {"result": 105}, data; print("Addition OK")'

          curl -fsS --max-time 5 "http://127.0.0.1:8000/version" \
            | python3 -c 'import json, sys; data = json.load(sys.stdin); assert data == {"version": "1.0.1"}, data; print("Version OK")'

      - name: Cleanup
        if: always()
        run: docker rm -f exam-app
